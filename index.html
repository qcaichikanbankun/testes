<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>刻印OCRテスト</title>
    <!-- Tesseract.js (文字認識AI) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        .canvas-container { position: relative; width: 100%; max-width: 400px; aspect-ratio: 1/1; border: 3px solid #007bff; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        #canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); /* インカメラ用の反転 */ }
        
        .controls { width: 100%; max-width: 400px; background: #222; padding: 15px; border-radius: 10px; box-sizing: border-box; }
        .slider-label { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; }
        input[type="range"] { width: 100%; margin-bottom: 20px; }
        
        #result-box { width: 100%; max-width: 400px; background: #fff; color: #000; padding: 20px; border-radius: 10px; font-size: 2rem; font-weight: bold; text-align: center; min-height: 60px; box-sizing: border-box; margin-top: 10px; word-break: break-all; }
        #status { color: #ffeb3b; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>刻印 AIスキャンテスト</h1>
    
    <!-- AIが見ている「白黒フィルター後」の映像がここに映ります -->
    <div class="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <div class="slider-label">
            <span>影の濃さ調整（しきい値）</span>
            <span id="threshold-val">128</span>
        </div>
        <!-- このスライダーを動かして、文字が一番クッキリする場所を探します -->
        <input type="range" id="threshold" min="0" max="255" value="128">
    </div>

    <div id="status">AI準備中...</div>
    <div id="result-box">（ここに文字が出ます）</div>

<script>
const video = document.createElement("video");
const canvasElement = document.getElementById("canvas");
const ctx = canvasElement.getContext("2d", { willReadFrequently: true });
const thresholdSlider = document.getElementById("threshold");
const thresholdVal = document.getElementById("threshold-val");
const resultBox = document.getElementById("result-box");
const statusText = document.getElementById("status");

let ocrWorker = null;
let isProcessing = false;

// 1. AIエンジンの初期化
(async () => {
    ocrWorker = await Tesseract.createWorker('eng');
    await ocrWorker.setParameters({
        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-',
    });
    statusText.innerText = "かざしてください (自動読取中)";
    statusText.style.color = "#28a745";
    startCamera();
})();

// スライダーの表示更新
thresholdSlider.addEventListener('input', (e) => {
    thresholdVal.innerText = e.target.value;
});

// 2. インカメラの起動
async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user", width: { ideal: 1080 }, height: { ideal: 1080 } } 
        });
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        video.play();
        requestAnimationFrame(processFrame);
    } catch (err) {
        alert("カメラエラー: " + err);
    }
}

// 3. 映像のリアルタイム白黒化 ＆ OCR実行
function processFrame() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvasElement.width = video.videoWidth;
        canvasElement.height = video.videoHeight;
        
        // 映像をCanvasに描画
        ctx.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
        
        // ★ ここがキモ：画像を白黒（2値化）に変換するフィルター
        let imageData = ctx.getImageData(0, 0, canvasElement.width, canvasElement.height);
        let data = imageData.data;
        let threshold = parseInt(thresholdSlider.value);

        for (let i = 0; i < data.length; i += 4) {
            // ピクセルの明るさを計算
            let brightness = (data[i] * 0.299) + (data[i+1] * 0.587) + (data[i+2] * 0.114);
            // スライダーの値より暗ければ「黒」、明るければ「白」にする
            let color = brightness < threshold ? 0 : 255;
            data[i] = data[i+1] = data[i+2] = color; // RGBを全て同じ色に
        }
        ctx.putImageData(imageData, 0, 0); // フィルター後の画像を画面に表示

        // AIに文字を読ませる（処理中でなければ）
        if (ocrWorker && !isProcessing) {
            isProcessing = true;
            statusText.innerText = "解析中...";
            
            ocrWorker.recognize(canvasElement).then(({ data: { text } }) => {
                let cleanText = text.replace(/[^A-Za-z0-9-]/g, '').trim();
                if (cleanText.length >= 2) {
                    resultBox.innerText = cleanText; // 読み取った文字を表示
                }
                statusText.innerText = "かざしてください (自動読取中)";
                isProcessing = false;
            }).catch(e => {
                console.error(e);
                isProcessing = false;
            });
        }
    }
    requestAnimationFrame(processFrame);
}
</script>
</body>
</html>
